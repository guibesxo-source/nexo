<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Nexo · Criativos para Ads</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="ads/ads.css" />
<style>
  html, body { margin:0; height:100%; background:#ECEBE6; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script src="ads/ads-content.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">
const { createElement: h } = React;
const ADS = window.NEXO_ADS;

// All formats share 1080px width — only height changes.
const SCALE = 0.34;
const W = Math.round(1080 * SCALE);
const FMTS = {
  feed:  { h: 1350, title: 'Feed 4:5 · 1080×1350', sub: 'Instagram/Facebook feed · formato principal' },
  sq:    { h: 1080, title: 'Quadrado 1:1 · 1080×1080', sub: 'Feed quadrado · carrossel' },
  story: { h: 1920, title: 'Story 9:16 · 1080×1920', sub: 'Stories · Reels · TikTok' },
};

function Ad({ id, fmt }) {
  const H = FMTS[fmt].h;
  const html = ADS[id].replace('<div class="ad', '<div class="ad ' + fmt + ' ');
  return h('div', { style: { width: W, height: Math.round(H * SCALE), overflow: 'hidden', borderRadius: 8 } },
    h('div', {
      style: { width: 1080, height: H, transform: `scale(${SCALE})`, transformOrigin: 'top left' },
      dangerouslySetInnerHTML: { __html: html },
    }));
}

const ITEMS = [
  { id: 'problema',  label: '01 · Problema' },
  { id: 'solucao',   label: '02 · Solução' },
  { id: 'produto',   label: '03 · Produto' },
  { id: 'financeiro',label: '04 · Financeiro' },
  { id: 'editorial', label: '05 · Editorial' },
  { id: 'beta',      label: '06 · Beta' },
];

function App() {
  return h(DesignCanvas, null,
    ['feed', 'sq', 'story'].map(fmt =>
      h(DCSection, { key: fmt, id: fmt, title: FMTS[fmt].title, subtitle: FMTS[fmt].sub },
        ITEMS.map(it => h(DCArtboard, { key: fmt + '-' + it.id, id: fmt + '-' + it.id, label: it.label, width: W, height: Math.round(FMTS[fmt].h * SCALE) },
          h(Ad, { id: it.id, fmt }))))));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
