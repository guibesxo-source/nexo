<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Nexo · App</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
:root {
  --black: #000000;
  --ink: #0A0A0A;
  --white: #FFFFFF;
  --off-white: #F7F7F5;
  --green: #00E47C;
  --green-deep: #00B863;
  --green-soft: #E6FBF1;
  --muted: #4A4A4A;
  --dim: #6B6B6B;
  --line: rgba(0,0,0,0.10);
}

* { box-sizing: border-box; }
html, body, #root { margin: 0; min-height: 100%; }
body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--off-white);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; }

.app {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
}
.sidebar {
  background: var(--black);
  color: var(--white);
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: -0.04em;
}
.brand-mark {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--white);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.brand-mark::before {
  content: "";
  width: 12px;
  height: 12px;
  border-radius: 99px;
  background: var(--green);
  box-shadow: 0 0 0 3px var(--white), 0 0 0 4.5px var(--green);
}
.event-card {
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.06);
  border-radius: 14px;
  padding: 16px;
}
.event-card span {
  color: #B8B8B8;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.event-card strong {
  display: block;
  margin-top: 8px;
  line-height: 1.25;
}
.event-card small {
  display: block;
  color: #B8B8B8;
  margin-top: 6px;
  font-size: 12px;
}
.nav {
  display: grid;
  gap: 6px;
}
.nav button {
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: #C8C8C8;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  padding: 11px 12px;
  text-align: left;
}
.nav button:hover {
  background: rgba(255,255,255,0.08);
  color: var(--white);
}
.nav button.active {
  background: var(--green);
  color: var(--black);
}
.nav .icon {
  width: 18px;
  text-align: center;
}
.main {
  min-width: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
}
.topbar {
  height: 76px;
  background: var(--white);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 28px;
}
.menu-btn {
  display: none;
  border: 1px solid var(--line);
  background: var(--white);
  border-radius: 10px;
  cursor: pointer;
  font-weight: 900;
  padding: 9px 12px;
}
.crumb span {
  color: var(--dim);
  display: block;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.crumb strong {
  display: block;
  font-size: 22px;
  line-height: 1.15;
  margin-top: 2px;
}
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}
.btn {
  border: 0;
  border-radius: 10px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  min-height: 40px;
  padding: 0 16px;
}
.btn.primary {
  background: var(--green);
  color: var(--black);
}
.btn.outline {
  background: var(--white);
  border: 1.5px solid var(--black);
  color: var(--black);
}
.user-pill {
  border: 1px solid var(--line);
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  font-size: 13px;
  font-weight: 800;
  padding: 7px 12px;
}
.user-pill i {
  width: 24px;
  height: 24px;
  border-radius: 99px;
  background: var(--black);
  color: var(--green);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-style: normal;
}
.content {
  flex: 1;
  min-height: 0;
  overflow: auto;
}
.content-inner {
  max-width: 1180px;
  margin: 0 auto;
  padding: 28px;
}
.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 22px;
}
.page-head h1 {
  font-size: clamp(30px, 4.5vw, 44px);
  letter-spacing: -0.04em;
  line-height: 1.02;
  margin: 0;
}
.page-head p {
  color: var(--muted);
  margin: 8px 0 0;
  max-width: 62ch;
}
.kpis,
.card-grid,
.settings-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 18px;
}
.card-grid {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.settings-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.card,
.kpi,
.panel,
.row,
.task {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 18px 40px -32px rgba(0,0,0,0.32);
}
.kpi {
  padding: 18px;
}
.kpi span {
  color: var(--dim);
  display: block;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.kpi strong {
  display: block;
  font-size: 30px;
  letter-spacing: -0.03em;
  margin-top: 8px;
}
.kpi small {
  color: var(--green-deep);
  display: block;
  font-weight: 900;
  margin-top: 6px;
}
.grid-2,
.money-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.65fr);
  gap: 18px;
}
.panel,
.card {
  padding: 20px;
}
.panel h3,
.card h3 {
  font-size: 17px;
  letter-spacing: -0.02em;
  margin: 0 0 16px;
}
.bars {
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  gap: 10px;
  align-items: end;
  height: 230px;
}
.bar {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  height: 100%;
  justify-content: flex-end;
  color: var(--dim);
  font-size: 11px;
  font-weight: 800;
}
.bar i {
  display: block;
  width: 100%;
  min-height: 10px;
  border-radius: 8px 8px 0 0;
  background: var(--green);
}
.bar:nth-child(even) i {
  background: #DCDCD8;
}
.list,
.table,
.checklist {
  display: grid;
  gap: 10px;
}
.row,
.task {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 13px 14px;
}
.table .row {
  grid-template-columns: auto minmax(0, 1.2fr) minmax(120px, 0.6fr) auto;
}
.dot {
  width: 10px;
  height: 10px;
  border-radius: 99px;
  background: var(--green);
}
.avatar {
  width: 38px;
  height: 38px;
  border-radius: 99px;
  background: var(--black);
  color: var(--green);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 900;
}
.row strong,
.task strong {
  display: block;
  font-size: 14px;
}
.row span,
.task span,
.card p,
.panel p {
  color: var(--muted);
  font-size: 13px;
  margin: 3px 0 0;
}
.tag {
  border-radius: 999px;
  background: var(--green-soft);
  color: var(--green-deep);
  font-size: 11px;
  font-weight: 900;
  padding: 5px 9px;
  white-space: nowrap;
}
.tag.warn {
  background: #FEF3C7;
  color: #B45309;
}
.tag.info {
  background: #E0F2FE;
  color: #0369A1;
}
.progress {
  background: #E8E8E5;
  border-radius: 999px;
  height: 8px;
  overflow: hidden;
  margin-top: 14px;
}
.progress i {
  background: var(--green);
  border-radius: 999px;
  display: block;
  height: 100%;
}
.budget {
  background: var(--black);
  color: var(--white);
  border-radius: 16px;
  padding: 26px;
}
.budget span {
  color: #B8B8B8;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.budget strong {
  display: block;
  font-size: clamp(34px, 6vw, 56px);
  letter-spacing: -0.04em;
  line-height: 1;
  margin-top: 10px;
}
.budget i {
  color: var(--green);
  font-style: normal;
}
.task {
  grid-template-columns: auto minmax(0, 1fr) auto;
}
.task input {
  width: 18px;
  height: 18px;
  accent-color: var(--green);
}
.input {
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: 13px 14px;
  width: 100%;
}
.scrim {
  display: none;
}

@media (max-width: 980px) {
  .app {
    grid-template-columns: 1fr;
  }
  .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: 280px;
    z-index: 40;
    transform: translateX(-102%);
    transition: transform 0.2s ease;
  }
  .sidebar.open {
    transform: translateX(0);
  }
  .scrim {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 30;
    background: rgba(0,0,0,0.42);
  }
  .menu-btn {
    display: inline-flex;
  }
  .main {
    height: 100vh;
  }
  .kpis,
  .card-grid,
  .settings-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .grid-2,
  .money-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 640px) {
  .topbar {
    height: auto;
    align-items: flex-start;
    flex-direction: column;
    padding: 16px;
  }
  .topbar-actions {
    flex-wrap: wrap;
  }
  .content-inner {
    padding: 18px;
  }
  .page-head {
    flex-direction: column;
  }
  .kpis,
  .card-grid,
  .settings-grid {
    grid-template-columns: 1fr;
  }
  .table .row {
    grid-template-columns: auto minmax(0, 1fr);
  }
  .table .row > span:last-child,
  .table .row .tag {
    grid-column: 2;
    justify-self: start;
  }
  .user-pill {
    display: none;
  }
}

</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
function ToastHost({ children }) {
  return children;
}

const NAV_ITEMS = [
  ['dashboard', 'Dashboard', '▦'],
  ['eventos', 'Eventos', '□'],
  ['inscritos', 'Inscritos', '◎'],
  ['financeiro', 'Financeiro', '$'],
  ['checklist', 'Checklist', '✓'],
  ['membros', 'Membros', '●'],
  ['config', 'Configurações', '⚙'],
];

function Sidebar({ active, onNav, open, eventName }) {
  return (
    <aside className={'sidebar' + (open ? ' open' : '')}>
      <div className="brand"><span className="brand-mark"></span>Nexo</div>

      <div className="event-card">
        <span>Evento ativo</span>
        <strong>{eventName}</strong>
        <small>São Paulo · 18 a 20 jun · 320 inscritos</small>
      </div>

      <nav className="nav" aria-label="Navegação principal">
        {NAV_ITEMS.map(([id, label, icon]) => (
          <button
            key={id}
            type="button"
            className={active === id ? 'active' : ''}
            onClick={() => onNav(id)}
          >
            <span className="icon">{icon}</span>
            {label}
          </button>
        ))}
      </nav>
    </aside>
  );
}

function Topbar({ crumb, onMenu }) {
  return (
    <header className="topbar">
      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
        <button className="menu-btn" type="button" onClick={onMenu}>☰</button>
        <div className="crumb">
          <span>Nexo App</span>
          <strong>{crumb}</strong>
        </div>
      </div>

      <div className="topbar-actions">
        <button className="btn outline" type="button" onClick={() => window.top.location.hash = '#top'}>Ver LP</button>
        <button className="btn primary" type="button">Novo evento</button>
        <div className="user-pill"><i>GM</i> Guilherme</div>
      </div>
    </header>
  );
}

function PageHead({ title, description, action, onAction }) {
  return (
    <div className="page-head">
      <div>
        <h1>{title}</h1>
        <p>{description}</p>
      </div>
      {action && <button className="btn primary" type="button" onClick={onAction}>{action}</button>}
    </div>
  );
}

function Kpi({ label, value, delta }) {
  return (
    <div className="kpi">
      <span>{label}</span>
      <strong>{value}</strong>
      <small>{delta}</small>
    </div>
  );
}

function Tag({ children, tone = '' }) {
  return <span className={'tag' + (tone ? ' ' + tone : '')}>{children}</span>;
}

function Avatar({ children }) {
  return <div className="avatar">{children}</div>;
}

</script>
<script type="text/babel">
function Dashboard({ go }) {
  return (
    <>
      <PageHead
        title="Operação em tempo real."
        description="Visão executiva do evento, com inscrições, receita, orçamento e tarefas críticas no mesmo painel."
        action="Ver financeiro"
        onAction={() => go('financeiro')}
      />

      <div className="kpis">
        <Kpi label="Inscritos" value="320" delta="+24 hoje" />

        <div className="panel">
          <h3>Alertas da operação</h3>

            <div className="row"><i className="dot"></i><div><strong>Patrocínio recebido</strong><span>Stripe Brasil · R$ 25.000</span></div><Tag tone="info">Novo</Tag></div>
          </div>
        </div>
      </div>

}

function Eventos() {

                <h3>{title}</h3>
                <p>{meta}</p>
              </div>
              <Tag tone={tone}>{status}</Tag>

function Inscritos() {
  const rows = [
    ['MC', 'Mariana Costa', 'mariana@octopus.io', 'Octopus Studio', 'Confirmado', ''],
    ['RP', 'Rafael Pereira', 'rafael@brand.co', 'Brand & Co.', 'Check-in', 'info'],
    ['JS', 'Júlia Santos', 'julia@hubinc.com', 'Hub Inc.', 'Pendente', 'warn'],
    ['DA', 'Diego Almeida', 'diego@nexus.ai', 'Nexus AI', 'Confirmado', ''],
    ['CL', 'Carolina Lima', 'carol@summit.co', 'Summit.co', 'Confirmado', ''],

  return (
    <>
      <PageHead

      />

</script>
<script type="text/babel">
function Financeiro() {
  return (
    <>
      <PageHead
        title="Financeiro rastreável."
        description="Orçamento, lançamentos, notas fiscais e receitas do evento em uma única trilha de controle."
        action="Novo lançamento"
      />

      <div className="money-grid">
        <div className="budget">

          <strong>R$ 147.620<i>,00</i></strong>

        </div>

        <div className="panel">
          <h3>Por categoria</h3>
          <div className="list">
            <div className="row"><i className="dot"></i><div><strong>Local & estrutura</strong><span>R$ 62.400</span></div><Tag>92%</Tag></div>
            <div className="row"><i className="dot"></i><div><strong>Marketing</strong><span>R$ 38.200</span></div><Tag>68%</Tag></div>
            <div className="row"><i className="dot"></i><div><strong>Catering</strong><span>R$ 27.000</span></div><Tag tone="warn">NF</Tag></div>
          </div>
        </div>
      </div>
    </>

function Checklist() {
  const tasks = [
    ['Fechar grade de palestrantes', 'Responsável: Carol · concluído', true, 'Ok', ''],
    ['Enviar layout final para fornecedores', 'Responsável: Rafael · concluído', true, 'Ok', ''],
    ['Validar NF do catering', 'Responsável: Diego · vence hoje', false, 'Crítico', 'warn'],
    ['Confirmar equipe de credenciamento', 'Responsável: Mariana · amanhã', false, 'Em andamento', 'info'],
  ];

  return (
    <>
      <PageHead
        title="Checklist vivo."
        description="Todo responsável sabe o que fazer, quando vence e o que já foi concluído."
        action="Adicionar tarefa"
      />
      <div className="checklist">
        {tasks.map(([title, meta, checked, status, tone]) => (
          <label className="task" key={title}>
            <input type="checkbox" defaultChecked={checked} />
            <div><strong>{title}</strong><span>{meta}</span></div>
            <Tag tone={tone}>{status}</Tag>
          </label>
        ))}
      </div>
    </>

}

function Membros() {
  const members = [
    ['GM', 'Guilherme Moraes', 'Owner · acesso total', 'Online', ''],
    ['MC', 'Mariana Costa', 'Operação · checklist e inscritos', 'Ativa', 'info'],
    ['DA', 'Diego Almeida', 'Financeiro · orçamento e NFs', 'Revisão', 'warn'],
  ];

    <>
      <PageHead
        title="Equipe alinhada."
        description="Distribua papéis, acompanhe responsabilidades e reduza ruído operacional."

      />
      <div className="card-grid">
        {members.map(([initials, name, role, status, tone]) => (
          <div className="card" key={name}>
            <Avatar>{initials}</Avatar>
            <h3 style={{ marginTop: 18 }}>{name}</h3>
            <p>{role}</p>
            <div style={{ marginTop: 16 }}><Tag tone={tone}>{status}</Tag></div>
          </div>
        ))}
      </div>

function Config() {
  return (
    <>
      <PageHead
        title="Configurações do hub."
        description="Controle dados do evento, permissões, integrações e preferências da operação."
        action="Salvar alterações"
      />
      <div className="settings-grid">
        <div className="panel">
          <h3>Dados do evento</h3>
          <input className="input" defaultValue="Summit de Marketing 2026" />
          <br /><br />
          <input className="input" defaultValue="São Paulo · WTC Events Center" />
        </div>
        <div className="panel">
          <h3>Integrações</h3>
          <div className="list">
            <div className="row"><i className="dot"></i><div><strong>HubSpot</strong><span>Formulário do beta conectado</span></div><Tag>Ativo</Tag></div>
            <div className="row"><i className="dot"></i><div><strong>Pagamentos</strong><span>Stripe em configuração</span></div><Tag tone="warn">Pendente</Tag></div>
          </div>
        </div>
        <div className="panel">
          <h3>Permissões</h3>
          <p>Owners podem editar financeiro, inscritos, equipe e configurações. Operação pode atualizar checklist e check-in.</p>
        </div>
        <div className="panel">
          <h3>Notificações</h3>
          <p>Alertas de vencimento, orçamento e tarefas críticas habilitados para o evento ativo.</p>
        </div>

}

</script>
<script type="text/babel">
const { useState, useEffect } = React;

const CRUMBS = {
  dashboard: 'Dashboard', eventos: 'Eventos', inscritos: 'Inscritos',
  financeiro: 'Financeiro', checklist: 'Checklist', membros: 'Membros', config: 'Configurações',
};
const VIEWS = {
  dashboard: Dashboard, eventos: Eventos, inscritos: Inscritos,
  financeiro: Financeiro, checklist: Checklist, membros: Membros, config: Config,
};

function App() {
  const [route, setRoute] = useState(() => {
    const stored = localStorage.getItem('nexo_route');
    const hash = location.hash.replace('#', '');
    return VIEWS[hash] ? hash : (VIEWS[stored] ? stored : 'dashboard');
  });
  const [menuOpen, setMenuOpen] = useState(false);

  const go = (id) => {
    setRoute(id);
    setMenuOpen(false);
    localStorage.setItem('nexo_route', id);
    history.replaceState(null, '', '#' + id);
    document.querySelector('.content')?.scrollTo({ top: 0 });
  };

  const View = VIEWS[route] || Dashboard;

  return (
    <ToastHost>
      <div className="app">
        {menuOpen && <div className="scrim" onClick={() => setMenuOpen(false)}></div>}
        <Sidebar active={route} onNav={go} open={menuOpen} eventName="Summit de Marketing 2026" />
        <div className="main">
          <Topbar crumb={CRUMBS[route]} onMenu={() => setMenuOpen(o => !o)} />
          <div className="content">
            <div className="content-inner">
              <View go={go} />
            </div>
          </div>
        </div>
      </div>
    </ToastHost>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
